aid: openpages
name: OpenPages
description: >-
  IBM OpenPages is an AI-driven, unified governance, risk, and compliance (GRC)
  platform delivered as a managed service on IBM Cloud. Originally founded as
  OpenPages Inc. (a Matrix Partners portfolio company) and acquired by IBM in
  2010, it consolidates operational risk, regulatory compliance, financial
  controls, policy, IT governance, third-party risk, and model/AI governance
  (watsonx.governance) into one system of record. OpenPages exposes a data-centric
  GRC REST API (v1 and v2), an ObjectManager CLI (ibmcloud openpages), IBM Cloud
  IAM authentication, and event notifications (CloudEvents v1.0) so teams can
  automate configuration, integrate risk data, and drive event-driven workflows.
