apis:
- name: IBM OpenPages GRC REST API
  description: >-
    Data-centric GRC REST API for IBM OpenPages, specified in terms of resources,
    their URIs, and the actions that can be performed on those URIs. Available as
    v1 and v2. The API is hosted per service instance (the instance Fixed URL or
    a custom hostname), authenticated with IBM Cloud IAM, and reachable only from
    allow-listed IP addresses when IP allowlisting is enabled.
